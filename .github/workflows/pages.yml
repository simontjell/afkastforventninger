name: Opdater og udgiv

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"   # dagligt; rådet offentliggør to gange om året
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Hent nye regneark
        run: python -m afkast.fetch
      - name: Test (fejler, hvis et nyt regneark ikke kan læses sikkert)
        run: python -m pytest -q
      - name: Byg
        run: python -m afkast.build
      - name: Gem nye regneark i repoet
        run: |
          git add kilder
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Nye regneark fra afkastforventninger.dk"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
